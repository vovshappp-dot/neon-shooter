<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover,maximum-scale=1"><title>Neon Shooter 2.0</title><style>*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;overflow:hidden;background:#05050a;font-family:Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;top:6px;left:0;right:0;display:flex;justify-content:space-between;padding:0 6px;pointer-events:none;z-index:10;flex-wrap:wrap;gap:4px}.stat{background:rgba(10,10,25,.9);border:2px solid #00ffff;border-radius:8px;padding:5px 10px;color:#00ffff;font-weight:700;font-size:13px;text-shadow:0 0 6px #00ffff;white-space:nowrap;display:flex;align-items:center;gap:4px}.stat.lives{border-color:#ff00cc;color:#ff00cc}.stat.weapon{border-color:#ffcc00;color:#ffcc00}.stat.shield{border-color:#00ff88;color:#00ff88}.stat.coins{border-color:#ffcc00;color:#ffcc00}#waveBar{position:fixed;top:42px;left:50%;transform:translateX(-50%);width:60%;max-width:300px;height:6px;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden;z-index:9;pointer-events:none;border:1px solid rgba(0,255,255,.3)}#waveBarFill{height:100%;background:linear-gradient(90deg,#00ffff,#ff00cc);width:0%;transition:width .3s}#rageBtn{position:fixed;bottom:20px;right:15px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#ff00cc,#660066);border:3px solid #ff00cc;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;text-shadow:0 0 8px #fff;box-shadow:0 0 20px rgba(255,0,204,.6);font-family:inherit;text-align:center;line-height:1.1;flex-direction:column;padding:5px}#rageBtn.ready{animation:rp 1s infinite;box-shadow:0 0 40px rgba(255,0,204,1)}#rageBtn:disabled{opacity:.5;filter:grayscale(.6)}@keyframes rp{0%,100%{transform:s r;gap:10px}.shop-item-info{flex:1}.shop-item-name{color:#00ffff;font-weight:700;font-size:14px;margin-bottom:4px}.shop-item-desc{color:#888;font-size:11px;margin-bottom:4px}.shop-item-level{color:#ffcc00;font-size:11px;font-weight:700}.shop-item button{background:linear-gradient(180deg,#ffcc00,#ff8800);border:2px solid #fff;border-radius:8px;padding:8px 14px;color:#000;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap}.shop-item button:disabled{opacity:.4}#shopClose{position:fixed;top:15px;right:15px;background:transparent;border:2px solid #ff3355;color:#ff3355;border-radius:50%;width:40px;height:40px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;z-index:160}#daily{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,25,.98);border:3px solid #ffcc00;border-radius:20px;padding:25px;text-align:center;z-index:200;display:none;max-width:320px;width:90%;box-shadow:0 0 40px rgba(255,204,0,.6)}#daily.show{display:block}#daily h3{color:#ffcc00;font-size:20px;margin-bottom:10px}#daily p{color:#fff;font-size:13px;margin-bottom:15px;line-height:1.6}#daily .reward{color:#00ff88;font-size:26px;font-weight:700;margin-bottom:15px;text-shadow:0 0 15px #00ff88}#daily button{background:linear-gradient(180deg,#ffcc00,#ff8800);border:2px solid #fff;border-radius:10px;padding:10px 25px;color:#000;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(0,0,0,.9);border:2px solid #00ffff;color:#fff;padding:12px 24px;border-radius:12px;font-weight:700;font-size:15px;z-index:300;transition:transform .2s;pointer-events:none;text-align:center}#toast.show{transform:translate(-50%,-50%) scale(1)}#pause{position:fixed;inset:0;background:rgba(5,5,10,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:180;padding:20px;text-align:center}#pause.show{display:flex}#pause h2{color:#ff00cc;font-size:28px;margin-bottom:20px;text-shadow:0 0 20px #ff00cc}#pause button{background:transparent;border:3px solid #00ffff;color:#00ffff;padding:12px 30px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin:6px;font-family:inherit;text-transform:uppercase}#pause button:hover{background:#00ffff;color:#05050a}</style></head><body><canvas id="game"></canvas><div id="waveBar"><div id="waveBarFill"></div></div><div id="ui"><div class="stat">🎯 <span id="score">0</span></div><div class="stat">🌊 <span id="wave">1</span></div><div class="stat lives">❤ <span id="lives">5</span></div><div class="stat weapon">⚔ <span id="weapon">Normal</span></div><div class="stat shield" id="shieldStat" style="display:none">🛡 <span id="shieldTimer">0</span></div><div class="stat coins">💰 <span id="coinsDisplay">0</span></div><div class="stat">🏆 <span id="best">0</span></div></div><button id="pauseBtn">⏸</button><button id="rageBtn" disabled>ЯРОСТЬ<span id="rageCharge">0%</span></button><div id="overlay"><h1>NEON SHOOTER 2.0</h1><p>Води пальцем по экрану — корабль следует за ним.<br>Стрельба автоматическая.</p><div class="final" id="finalScore" style="display:none"></div><button class="main-btn" id="startBtn">ИГРАТЬ</button><button class="main-btn shop-btn" id="shopBtn">МАГАЗИН</button><div class="legend"><b>H</b> аптечка &nbsp; <b>S</b> ускорение &nbsp; <b>D</b> щит<br><b>B</b> бомба &nbsp; <b>W</b> оружие &nbsp; <b>X2</b> очки<br><b>ЯРОСТЬ</b> — кнопка справа</div></div><div id="shop"><button id="shopClose">✕</button><h2>МАГАЗИН</h2><div class="shop-coins">💰 <span id="shopCoins">0</span></div><div class="shop-items" id="shopItems"></div></div><div id="daily"><h3>🎁 НАГРАДА</h3><p>Заходи каждый день!</p><div class="reward" id="dailyReward">+50 💰</div><button id="dailyClaim">ЗАБРАТЬ</button></div><div id="pause"><h2>ПАУЗА</h2><button id="resumeBtn">Продолжить</button><button id="menuBtn">В меню</button></div><div id="toast"></div><script>(function(){'use strict';var SK='ns_v7';var dS={best:0,coins:0,upgrades:{maxLives:0,damage:0,speed:0,startWeapon:0,coinBonus:0},lastDaily:0,dailyStreak:0};var save=JSON.parse(JSON.stringify(dS));try{var r=localStorage.getItem(SK);if(r){var p=JSON.parse(r);if(p&&p.upgrades)save=p}}catch(e){}function saveGame(){try{localStorage.setItem(SK,JSON.stringify(save))}catch(e){}}var canvas=document.getElementById('game'),ctx=canvas.getContext('2d');var scoreEl=document.getElementById('score'),waveEl=document.getElementById('wave'),livesEl=document.getElementById('lives'),weaponEl=document.getElementById('weapon'),bestEl=document.getElementById('best'),coinsDisplayEl=document.getElementById('coinsDisplay'),overlay=document.getElementById('overlay'),startBtn=document.getElementById('startBtn'),shopBtn=document.getElementById('shopBtn'),shopClose=document.getElementById('shopClose'),shopEl=document.getElementById('shop'),shopCoinsEl=document.getElementById('shopCoins'),shopItemsEl=document.getElementById('shopItems'),finalScoreEl=document.getElementById('finalScore'),shieldStat=document.getElementById('shieldStat'),shieldTimerEl=document.getElementById('shieldTimer'),rageBtn=document.getElementById('rageBtn'),rageChargeEl=document.getElementById('rageCharge'),dailyEl=document.getElementById('daily'),dailyRewardEl=document.getElementById('dailyReward'),dailyClaim=document.getElementById('dailyClaim'),toast=document.getElementById('toast'),waveBarFill=document.getElementById('waveBarFill'),pauseBtn=document.getElementById('pauseBtn'),pauseEl=document.getElementById('pause'),resumeBtn=document.getElementById('resumeBtn'),menuBtn=document.getElementById('menuBtn');var W=window.innerWidth,H=window.innerHeight;canvas.width=W;canvas.height=H;window.addEventListener('resize',function(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight});var audioCtx=null;function initAudio(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){audioCtx=null}}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume()}function beep(f,d,t,v){if(!audioCtx)return;try{var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t||'square';o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(f*.5,audioCtx.currentTime+d);g.gain.setValueAtTime(v||.05,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}function sShoot(){beep(880,.05,'square',.03)}function sExplode(){beep(120,.3,'sawtooth',.06)}function sHit(){beep(200,.2,'sawtooth',.1)}function sBonus(){beep(1200,.15,'sine',.08)}function sRage(){beep(300,.5,'sawtooth',.15)}var toastTimer=null;function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){toast.classList.remove('show')},1400)}var SHOP=[{key:'maxLives',name:'❤ Доп. жизнь',desc:'+1 жизнь',maxLevel:3,basePrice:500,priceStep:500},{key:'damage',name:'💥 Урон',desc:'+10% урона',maxLevel:5,basePrice:300,priceStep:300},{key:'speed',name:'⚡ Скорость',desc:'+8% скорости',maxLevel:5,basePrice:300,priceStep:300},{key:'startWeapon',name:'🔫 Оружие',desc:'Double / Laser',maxLevel:2,basePrice:1000,priceStep:1500},{key:'coinBonus',name:'💰 Монеты',desc:'+20% монет',maxLevel:5,basePrice:400,priceStep:400}];function getPrice(i){return i.basePrice+save.upgrades[i.key]*i.priceStep}function recalcStats(){maxLives=3+save.upgrades.maxLives;damageMultiplier=1+save.upgrades.damage*.1;speedMultiplier=1+save.upgrades.speed*.08}function renderShop(){shopCoinsEl.textContent=save.coins;shopItemsEl.innerHTML='';SHOP.forEach(function(item){var l=save.upgrades[item.key],mx=l>=item.maxLevel,pr=getPrice(item),cb=!mx&&save.coins>=pr;var div=document.createElement('div');div.className='shop-item';div.innerHTML='<div class="shop-item-info"><div class="shop-item-name">'+item.name+'</div><div class="shop-item-desc">'+item.desc+'</div><div class="shop-item-level">Ур: '+l+' / '+item.maxLevel+'</div></div><button '+(cb?'':'disabled')+'>'+(mx?'MAX':pr+' 💰')+'</button>';var btn=div.querySelector('button');btn.addEventListener('click',function(){if(mx||save.coins<pr)return;save.coins-=pr;save.upgrades[item.key]++;recalcStats();saveGame();renderShop();updateCoinsUI();showToast('✅ Улучшено!')});shopItemsEl.appendChild(div)})}function updateCoinsUI(){coinsDisplayEl.textContent=save.coins}shopBtn.addEventListener('click',function(){renderShop();shopEl.classList.add('show')});shopClose.addEventListener('click',function(){shopEl.classList.remove('show')});function checkDaily(){var now=Date.now(),dm=86400000,tp=now-save.lastDaily;if(tp>=dm){var rw=50+save.dailyStreak*10;if(save.dailyStreak>10)rw=200;dailyRewardEl.textContent='+'+rw+' 💰';dailyEl.classList.add('show');dailyClaim.onclick=function(){save.coins+=rw;save.lastDaily=now;save.dailyStreak++;if(tp>=2*dm)save.dailyStreak=1;saveGame();dailyEl.classList.remove('show');updateCoinsUI();showToast('🎁 +'+rw)}}}setTimeout(checkDaily,1000);var player=null,bullets=[],enemies=[],particles=[],bonuses=[];var score=0,wave=1,waveTimer=0,spawnTimer=0,spawnInterval=50,gameActive=false,lives=5,weapon='normal',weaponTimer=0,invulnerable=0,screenShake=0,shootCooldown=0,shieldActive=false,shieldTime=0,speedBoost=false,speedTimer=0,x2Active=false,x2Timer=0,rageCharge=0,rageActive=false,rageTimer=0,bossActive=false,paused=false;var maxLives=3+save.upgrades.maxLives,damageMultiplier=1+save.upgrades.damage*.1,speedMultiplier=1+save.upgrades.speed*.08;bestEl.textContent=save.best;updateCoinsUI();var starsLayers=[[],[],[]],planets=[];function initBackground(){starsLayers=[[],[],[]];for(var L=0;L<3;L++){var c=40+L*20;for(var i=0;i<c;i++)starsLayers[L].push({x:Math.random()*W,y:Math.random()*H,size:.5+L*.7+Math.random()*.5,speed:.2+L*.5,alpha:.3+L*.25})}planets=[{x:W*.85,y:H*.15,radius:60,color:'#ff00cc',speed:.02,alpha:.15},{x:W*.15,y:H*.7,radius:45,color:'#00ffff',speed:.015,alpha:.12},{x:W*.5,y:H*.9,radius:80,color:'#ffcc00',speed:.01,alpha:.08}]}var pointerActive=false,pointerX=0,pointerY=0;canvas.addEventListener('touchstart',function(e){e.preventDefault();initAudio();if(gameActive&&!paused&&e.touches.length>0){var t=e.touches[0];pointerX=t.clientX;pointerY=t.clientY;pointerActive=true}},{passive:false});canvas.addEventListener('touchmove',function(e){e.preventDefault();if(gameActive&&!paused&&e.touches.length>0){var t=e.touches[0];pointerX=t.clientX;pointerY=t.clientY}},{passive:false});canvas.addEventListener('touchend',function(e){e.preventDefault();pointerActive=false},{passive:false});canvas.addEventListener('mousedown',function(e){initAudio();pointerX=e.clientX;pointerY=e.clientY;pointerActive=true});canvas.addEventListener('mousemove',function(e){if(pointerActive){pointerX=e.clientX;pointerY=e.clientY}});window.addEventListener('mouseup',function(){pointerActive=false});pauseBtn.addEventListener('click',function(){if(gameActive){paused=true;pauseEl.classList.add('show')}});resumeBtn.addEventListener('click',function(){paused=false;pauseEl.classList.remove('show')});menuBtn.addEventListener('click',function(){paused=false;pauseEl.classList.remove('show');gameActive=false;overlay.classList.remove('hidden')});function shoot(){if(!player||!gameActive)return;var d=damageMultiplier,s=rageActive?3:1;if(weapon==='normal')bullets.push({x:player.x,y:player.y-20,vx:0,vy:-12*s,radius:4,life:100,damage:1*d,color:'#00ffff',pierce:false});else if(weapon==='double'){bullets.push({x:player.x-10,y:player.y-15,vx:-1.5,vy:-12*s,radius:4,life:100,damage:1*d,color:'#cc66ff',pierce:false});bullets.push({x:player.x+10,y:player.y-15,vx:1.5,vy:-12*s,radius:4,life:100,damage:1*d,color:'#cc66ff',pierce:false})}else bullets.push({x:player.x,y:player.y-20,vx:0,vy:-18*s,radius:6,life:80,damage:3*d,color:'#ffcc00',pierce:true});sShoot()}function spawnEnemy(){if(!player)return;var side=Math.random(),x,y,vx,vy,type;if(side<.4){x=Math.random()*W;y=-30;var a=Math
